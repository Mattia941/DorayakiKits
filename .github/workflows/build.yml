name: Build Plugin

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Maven
      run: |
        echo "<project><modelVersion>4.0.0</modelVersion><groupId>com.dorayakimc</groupId><artifactId>DorayakiKits</artifactId><version>1.0</version><packaging>jar</packaging><dependencies><dependency><groupId>dev.folia</groupId><artifactId>folia-api</artifactId><version>1.20.4-R0.1-SNAPSHOT</version><scope>provided</scope></dependency></dependencies><build><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId><version>3.8.1</version><configuration><source>17</source><target>17</target></configuration></plugin></plugins></build></project>" > pom.xml
        mvn clean package
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DorayakiKits
        path: target/DorayakiKits-1.0.jar
